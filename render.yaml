# Render Blueprint — free plan variant
# NOTE: free plan = 512MB RAM. Camoufox is memory-tuned via
# MOZ_FORCE_DISABLE_E10S (single-process Firefox) + MALLOC_ARENA_MAX=2.
# Keepalive is OFF on free: letting the instance sleep keeps RAM clean.
services:
  - type: web
    name: pro-movieapidrive
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MKV_ENGINE
        value: camoufox
      - key: MKV_HEADLESS
        value: "true"
      - key: MKV_KEEPALIVE
        value: "false"
      - key: MKV_PREWARM
        value: "true"       # clear CF at boot so the first search is fast
      - key: MKV_CACHE_TTL
        value: "300"        # repeat searches within 5 min are served instantly
      - key: MKV_DATA_DIR
        value: /tmp/data
      - key: MOZ_FORCE_DISABLE_E10S
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
